services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: market_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Host clients use localhost:9092.
      # Docker containers use kafka:29092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1
    container_name: market_cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: market-intel-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    container_name: market_api
    ports:
      - "8000:8000"
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: market_intel
    volumes:
      - ../../data:/app/data:ro
      - ../../config:/app/config:ro
    depends_on:
      - cassandra
    restart: unless-stopped

  online-inference:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python
    container_name: market_online_inference
    env_file:
      - ../../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: market_intel
      ONLINE_MODEL_PATH: /app/data/model_artifacts/online_serving/logistic_regression_online.json
      ONLINE_INFERENCE_SYMBOLS: AAPL,MSFT,NVDA,AMZN,TSLA
    volumes:
      - ../..:/app
    working_dir: /app
    command: >
      sh -lc "KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      CASSANDRA_HOSTS=cassandra
      python services/inference/online_market_inference.py"
    depends_on:
      - kafka
      - cassandra
    restart: unless-stopped

  dashboard:
    build:
      context: ../..
      dockerfile: services/dashboard/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
        VITE_WS_BASE: ws://localhost:8000
    container_name: market_dashboard
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: market_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: market_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/etc/grafana/provisioning-dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  mlflow:
    build:
      context: ../..
      dockerfile: infra/mlflow/Dockerfile
    container_name: market_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  hadoop-namenode:
    image: apache/hadoop:3.4.1
    container_name: market_hadoop_namenode
    hostname: hadoop-namenode
    user: root
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: >
      bash -c "
      if [ ! -f /tmp/hadoop-root/dfs/name/current/VERSION ]; then
        hdfs namenode -format -force -nonInteractive;
      fi;
      hdfs namenode
      "
    volumes:
      - hadoop_namenode:/tmp/hadoop-root/dfs/name
      - ../hdfs/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hdfs/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    restart: unless-stopped

  hadoop-datanode:
    image: apache/hadoop:3.4.1
    container_name: market_hadoop_datanode
    hostname: hadoop-datanode
    user: root
    depends_on:
      - hadoop-namenode
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: >
      bash -c "
      sleep 10;
      hdfs datanode
      "
    volumes:
      - hadoop_datanode:/tmp/hadoop-root/dfs/data
      - ../hdfs/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hdfs/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    restart: unless-stopped

volumes:
  cassandra_data:
  prometheus_data:
  grafana_data:
  mlflow_data:
  hadoop_namenode:
  hadoop_datanode:
